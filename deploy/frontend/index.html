<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Устное собеседование 9 класс - OnCube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Устное собеседование по русскому языку</h1>
            <p class="subtitle">Подготовка к устному собеседованию для 9 класса</p>
        </header>

        <main id="main-content">
            <div class="exam-section">
                <h2>Выберите тип задания</h2>
                <div class="task-types">
                    <button class="task-btn" data-type="reading">Чтение текста</button>
                    <button class="task-btn" data-type="retelling">Пересказ текста</button>
                    <button class="task-btn" data-type="monologue">Монолог</button>
                </div>
            </div>

            <div id="task-section" class="task-section hidden">
                <h2 id="task-title"></h2>
                <div class="task-content">
                    <div class="task-instructions">
                        <h3>Инструкции:</h3>
                        <p id="instructions"></p>
                    </div>
                    <div class="task-text">
                        <h3>Задание:</h3>
                        <div id="task-text-content"></div>
                    </div>
                </div>
                
                <div class="answer-section">
                    <h3>Ваш ответ (аудиозапись):</h3>
                    <div class="audio-recorder">
                        <p id="recording-status" class="recording-status">
                            Нажмите «Начать запись» и произнесите ответ.
                        </p>
                        <div class="audio-recorder-controls">
                            <button id="start-record-btn" class="record-btn primary">Начать запись</button>
                            <button id="stop-record-btn" class="record-btn danger" disabled>Остановить</button>
                            <button id="play-record-btn" class="record-btn" disabled>Прослушать</button>
                            <button id="clear-record-btn" class="record-btn secondary" disabled>Удалить запись</button>
                        </div>
                        <div class="recording-info">
                            <span id="recording-timer" class="recording-timer">00:00</span>
                        </div>
                        <audio id="audio-preview" class="audio-preview hidden" controls></audio>
                    </div>
                    <div class="buttons">
                        <button id="check-btn" class="check-btn" disabled>Отправить на проверку</button>
                        <button id="new-task-btn" class="new-task-btn">Новое задание</button>
                    </div>
                </div>
            </div>

            <div id="result-section" class="result-section hidden">
                <h2>Результат проверки</h2>
                <p id="result-task-type" class="result-task-type"></p>
                <div class="score">
                    <span class="score-value" id="score"></span>
                    <span class="score-max" id="max-score"></span>
                </div>
                <div class="feedback">
                    <h3>Обратная связь:</h3>
                    <p id="feedback-text"></p>
                </div>
                <div class="criteria" id="criteria"></div>
                <button id="back-btn" class="back-btn">Вернуться к заданию</button>
            </div>

            <div id="loading" class="loading hidden">
                <p>Проверка ответа...</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
